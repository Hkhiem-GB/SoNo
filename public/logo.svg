<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Coin Medallion Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" />

  <!-- Ledger Book Body with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Book Back Spine/Pages depth -->
    <rect x="116" y="96" width="280" height="320" rx="24" fill="#ffffff" opacity="0.95" />
    <rect x="110" y="96" width="280" height="320" rx="24" fill="#f1f5f9" />

    <!-- Book Main Cover -->
    <rect x="100" y="96" width="280" height="320" rx="24" fill="url(#bookCover)" />

    <!-- Spine Binding Line -->
    <path d="M148 96 L148 416" stroke="#312e81" stroke-width="4" opacity="0.4" />
    <path d="M152 96 L152 416" stroke="#ffffff" stroke-width="1.5" opacity="0.2" />

    <!-- Golden Bookmark Ribbon Hanging from Top -->
    <path d="M204 96 L204 180 L220 162 L236 180 L236 96 Z" fill="url(#ribbonGrad)" opacity="0.95" />

    <!-- Decorative Ledger Balance Lines -->
    <rect x="176" y="210" width="168" height="12" rx="6" fill="#ffffff" opacity="0.25" />
    <rect x="176" y="238" width="120" height="10" rx="5" fill="#ffffff" opacity="0.2" />
    <rect x="176" y="262" width="144" height="10" rx="5" fill="#ffffff" opacity="0.2" />
  </g>

  <!-- Foreground Financial Coin / Seal (Emblem of Balance) -->
  <g filter="url(#coinShadow)">
    <circle cx="340" cy="330" r="76" fill="url(#coinGrad)" stroke="#ffffff" stroke-width="6" />
    <!-- Coin Inner Ring -->
    <circle cx="340" cy="330" r="64" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" stroke-dasharray="6,4" />

    <!-- Currency / Ledger Balance Emblem ($ / ₫ / Scales motif) -->
    <g fill="#ffffff">
      <!-- Stylized D/N balance icon -->
      <path d="M340 286 C322 286 312 296 312 308 C312 334 368 322 368 344 C368 354 356 360 340 360 C326 360 316 354 312 346 L300 354 C306 366 320 374 336 375 L336 386 L344 386 L344 375 C364 374 378 362 378 344 C378 318 322 330 322 308 C322 300 330 296 340 296 C352 296 360 300 366 308 L376 298 C368 288 356 286 344 286 L344 274 L336 274 L336 286 Z" />
    </g>
  </g>

  <!-- Sparkle Accent -->
  <polygon points="400,240 405,255 420,260 405,265 400,280 395,265 380,260 395,255" fill="#fde047" opacity="0.9" />
</svg>
